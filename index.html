<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nightfall Survivors</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080710;font-family:Georgia,'Times New Roman',serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:absolute;pointer-events:none;inset:0}.hud{position:absolute;top:18px;left:18px;width:260px}.level{display:flex;align-items:center;gap:10px}.levelgem{width:44px;height:44px;border:2px solid #9b75c9;border-radius:50%;display:grid;place-items:center;background:rgba(20,11,38,.9);box-shadow:0 0 18px #713ca7}.levelgem b{font-size:20px}.xpbg{flex:1;height:10px;border:1px solid #3b2c56;border-radius:8px;background:#100c18;overflow:hidden}.xp{height:100%;width:0;background:linear-gradient(90deg,#6fc7ff,#b17cff);box-shadow:0 0 8px #a17cff}.stats{margin-top:12px;display:flex;gap:8px}.stat{background:rgba(12,9,24,.82);border:1px solid rgba(156,117,195,.35);border-radius:7px;padding:6px 9px;min-width:57px;text-align:center}.stat small{display:block;color:#bbaed1;font-family:sans-serif;font-size:9px;text-transform:uppercase}.stat b{font-size:16px}.timer{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:25px;text-shadow:0 2px 8px #000}.kills{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-family:sans-serif;font-size:11px;color:#d0c6dc}.bossbar{position:absolute;top:82px;left:50%;transform:translateX(-50%);width:min(420px,50vw);display:none}.bossbar label{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}.bossbg{height:9px;background:#180d21;border:1px solid #71507d}.bossfill{height:100%;width:100%;background:linear-gradient(90deg,#9b2f64,#f06d91)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(31,18,52,.58),rgba(5,4,12,.94));pointer-events:auto}.overlay.hidden{display:none}.card{width:min(820px,calc(100% - 32px));text-align:center}.title{font-size:clamp(42px,7vw,82px);letter-spacing:5px;text-shadow:0 5px 18px #000;margin:0;color:#e7d9ff}.subtitle{margin:0 0 30px;color:#baaad0;letter-spacing:8px;font-size:12px;text-transform:uppercase}.start{border:1px solid #9e7bc1;background:linear-gradient(180deg,#50316e,#2c1b42);color:white;padding:14px 38px;font-family:Georgia;font-size:18px;letter-spacing:2px;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.5)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.upgrade{border:1px solid #674a82;background:linear-gradient(150deg,rgba(45,31,70,.96),rgba(18,13,32,.96));border-radius:8px;padding:18px 10px;color:white;cursor:pointer;min-height:170px}.upgrade:hover{border-color:#dfbaff;transform:translateY(-3px)}.upgrade .icon{font-size:38px;height:52px}.upgrade h3{margin:8px 0 6px;font-size:20px}.upgrade p{font-size:12px;color:#bdb2ca;margin:0}.leveltitle{font-size:16px;color:#d9c9ef;text-transform:uppercase;letter-spacing:5px}.gameover h2{font-size:62px;margin:0}.gameover p{color:#bdaecb}.touch{display:none;position:absolute;pointer-events:auto;width:120px;height:120px;left:22px;bottom:22px;border:1px solid rgba(205,190,224,.16);border-radius:50%;background:rgba(20,12,32,.12)}.stick{position:absolute;width:48px;height:48px;border-radius:50%;left:36px;top:36px;background:rgba(200,180,225,.22);border:1px solid rgba(230,215,248,.32)}
@media(max-width:700px){.hud{left:10px;top:9px;width:170px}.levelgem{width:36px;height:36px}.levelgem b{font-size:16px}.stats{display:none}.timer{top:10px;right:10px;left:auto;transform:none;font-size:18px}.kills{top:35px;right:10px;left:auto;transform:none}.bossbar{top:58px;width:70vw}.cards{grid-template-columns:1fr}.upgrade{min-height:90px}.upgrade .icon{height:32px;font-size:28px}.touch{display:block}.title{font-size:44px}.subtitle{margin-bottom:18px}}
</style></head>
<body>
<canvas id="game"></canvas><div class="ui">
<div class="hud"><div class="level"><div class="levelgem"><b id="level">1</b></div><div class="xpbg"><div class="xp" id="xp"></div></div></div><div class="stats"><div class="stat"><small>Damage</small><b id="damage">18</b></div><div class="stat"><small>Speed</small><b id="speed">18</b></div><div class="stat"><small>Health</small><b id="health">100</b></div></div></div>
<div class="timer" id="timer">00:00</div><div class="kills" id="kills">KILLS 0</div><div class="bossbar" id="bossbar"><label><span>Wretched Baron</span><span id="bosshealth"></span></label><div class="bossbg"><div class="bossfill" id="bossfill"></div></div></div>
<div class="overlay" id="start"><div class="card"><h1 class="title">NIGHTFALL</h1><p class="subtitle">Survivors of the Black Moon</p><button class="start" id="startbtn">ENTER THE NIGHT</button></div></div>
<div class="overlay hidden" id="upgrade"><div class="card"><div class="leveltitle">The moon grants you power</div><div class="cards" id="cards"></div></div></div>
<div class="overlay hidden" id="gameover"><div class="card gameover"><h2>FALLEN</h2><p id="summary">The night claims another soul</p><button class="start" id="again">RISE AGAIN</button></div></div><div class="touch" id="touch"><div class="stick" id="stick"></div></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let running=false,paused=false,last=0,time=0,kills=0,level=1,xp=0,xpNeed=25,shake=0,boss=null;
const player={x:0,y:0,r:14,hp:100,maxHp:100,speed:220,damage:18,fire:0.55,fireTimer:0,orbit:0};
let enemies=[],gems=[],projectiles=[],fx=[],keys={},camera={x:0,y:0},joystick={x:0,y:0,active:false};
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function spawnEnemy(bossSpawn=false){let a=rand(0,Math.PI*2),d=Math.max(W,H)*0.58+rand(30,180),x=player.x+Math.cos(a)*d,y=player.y+Math.sin(a)*d;if(bossSpawn){x=player.x+Math.cos(a)*420;y=player.y+Math.sin(a)*420}let isBoss=bossSpawn;enemies.push({x,y,r:isBoss?34:rand(10,15),hp:isBoss?900+time*8:28+time*1.25,maxHp:isBoss?900+time*8:28+time*1.25,speed:isBoss?48:rand(42,78)+time*.18,boss:isBoss,phase:rand(0,6),hit:0,damage:isBoss?26:9})}
function startGame(){running=true;paused=false;time=0;kills=0;level=1;xp=0;xpNeed=25;enemies=[];gems=[];projectiles=[];fx=[];boss=null;Object.assign(player,{x:0,y:0,hp:100,maxHp:100,speed:220,damage:18,fire:.55,fireTimer:0,orbit:0});document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'));document.getElementById('touch').style.display=innerWidth<700?'block':'none';last=performance.now()}
function endGame(){running=false;document.getElementById('gameover').classList.remove('hidden');document.getElementById('summary').textContent=`Level ${level} · ${kills} souls reclaimed · ${formatTime(time)}`}
function formatTime(t){let m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function levelUp(){paused=true;document.getElementById('upgrade').classList.remove('hidden');let pool=[['✦','Fang Shot','Increase damage by 8','damage'],['♢','Moonstep','Move 12% faster','speed'],['♥','Blood Rite','Gain 25 health','health'],['↯','Quickcast','Attack 15% faster','fire'],['◉','Grave Orbit','Orbiting skull damage','orbit']];pool.sort(()=>Math.random-.5);let cards=document.getElementById('cards');cards.innerHTML='';pool.slice(0,3).forEach(o=>{let b=document.createElement('button');b.className='upgrade';b.innerHTML=`<div class="icon">${o[0]}</div><h3>${o[1]}</h3><p>${o[2]}</p>`;b.onclick=()=>{if(o[3]=='damage')player.damage+=8;if(o[3]=='speed')player.speed*=1.12;if(o[3]=='health'){player.maxHp+=25;player.hp+=25}if(o[3]=='fire')player.fire*=.85;if(o[3]=='orbit')player.orbit++;paused=false;document.getElementById('upgrade').classList.add('hidden')};cards.appendChild(b)})}
const up={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};addEventListener('keydown',e=>{keys[up[e.code]||e.code]=true});addEventListener('keyup',e=>{keys[up[e.code]||e.code]=false});
const touch=document.getElementById('touch'),stick=document.getElementById('stick');function touchMove(e){let r=touch.getBoundingRect();let p=e.touches[0],cx=r.left+r.width/2,cy=r.top+r.height/2,dx=p.clientX-cx,dy=p.clientY-cy,d=Math.hypot(dx,dy)||1,m=Math.min(d,42);joystick.x=dx/d*Math.min(d/42,1);joystick.y=dy/d*Math.min(d/42,1);stick.style.transform=`translate(${dx/d*m-0}px,${dy/d*m-0}px)`;joystick.active=true}touch.addEventListener('touchstart',e=>{e.prevent;touchMove(e)},{passive:false});touch.addEventListener('touchmove',e=>{e.prevent;touchMove(e)},{passive:false});touch.addEventListener('touchend',()=>{joystick.active=false;joystick.x=joystick.y=0;stick.style.transform=''});
document.getElementById('startbtn').onclick=startGame;document.getElementById('again').onclick=startGame;
function update(dt){time+=dt;let dx=(keys.right||keys.KeyD?1:0)-(keys.left||keys.KeyA?1:0)+joystick.x,dy=(keys.down||keys.KeyS?1:0)-(keys.up||keys.KeyW?1:0)+joystick.y,d=Math.hypot(dx,dy)||1;player.x+=dx/d*player.speed*dt;player.y+=dy/d*player.speed*dt;
let spawnRate=Math.max(.18,.85-time*.006);if(!update.lastSpawn)update.lastSpawn=0;update.lastSpawn-=dt;if(update.lastSpawn<=0){spawnEnemy(false);update.lastSpawn=spawnRate}
if(time>60&&!boss){boss={};spawnEnemy(true);boss=enemies.find(e=>e.boss)}
player.fireTimer-=dt;if(player.fireTimer<=0){let target=null,best=Infinity;for(let e of enemies){let dd=dist(player,e);if(dd<best){best=dd;target=e}}if(target){let a=Math.atan2(target.y-player.y,target.x-player.x);projectiles.push({x:player.x,y:player.y,vx:Math.cos(a)*410,vy:Math.sin(a)*410,r:5,life:2,damage:player.damage});player.fireTimer=player.fire}player.fireTimer=Math.max(.08,player.fireTimer)}
for(let p of projectiles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}projectiles=projectiles.filter(p=>p.life>0);
for(let e of enemies){e.phase+=dt;if(e.hit>0)e.hit-=dt;let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(dist(player,e)<player.r+e.r){player.hp-=e.damage*dt*1.2;shake=6;if(player.hp<=0){endGame();return}}for(let p of projectiles){if(p.life>0&&dist(p,e)<p.r+e.r){e.hp-=p.damage;p.life=0;e.hit=.12;if(e.hp<=0){e.dead=true;kills++;gems.push({x:e.x,y:e.y,r:e.boss?13:5,val:e.boss?40:1+Math.random()*3,phase:rand(0,6)})}}} }
enemies=enemies.filter(e=>!e.dead);for(let g of gems){g.phase+=dt;let dd=dist(player,g);if(dd<140){let a=Math.atan2(player.y-g.y,player.x-g.y);g.x+=(player.x-g.x)*(6-dd/80)*dt;g.y+=(player.y-g.y)*(6-dd/80)*dt}if(dd<25){g.dead=true;xp+=g.val;if(xp>=xpNeed){level++;xp-=xpNeed;xpNeed*=1.25;levelUp()}}}gems=gems.filter(g=>!g.dead);
player.hp=Math.min(player.maxHp,player.hp+.7*dt);fx=fx.filter(f=>f.life>0);for(let f of fx){f.life-=dt}
if(player.orbit){for(let e of enemies){for(let i=0;i<player.orbit;i++){let a=time*2+i*Math.PI*2/player.orbit,ox=player.x+Math.cos(a)*55,oy=player.y+Math.sin(a)*55;if(dist(e,{x:ox,y:oy})<e.r+9&&(!e.orbitHit||e.orbitHit<time-.45)){e.hp-=12;e.orbitHit=time;if(e.hp<=0){e.dead=true;kills++;gems.push({x:e.x,y:e.y,r:5,val:2,phase:0})}}}}}
camera.x+=(player.x-camera.x)*.1;camera.y+=(player.y-camera.y)*.1;
let bs= Math.max(100,900+time*8);document.getElementById('bossbar').style.display=boss&&!boss.dead?'block':'none';if(boss){document.getElementById('bossfill').style.width=(boss.hp/boss.maxHp*100)+'%';document.getElementById('bosshealth').textContent=Math.ceil(boss.hp)}boss&&boss.dead&&(boss=null);
}
function draw(){ctx.clearRect(0,0,W,H);let cx=W/2-camera.x,cy=H/2-camera.y;ctx.fillStyle='#090914';ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(cx,cy);let grid=70,sx=-camera.x%grid,sy=-camera.y%grid;ctx.strokeStyle='rgba(74,60,96,.13)';ctx.lineWidth=1;for(let x=sx-W/2;x<W/2;x+=grid){ctx.beginPath();ctx.moveTo(x,-H/2);ctx.lineTo(x,H/2);ctx.stroke()}for(let y=sy-H/2;y<H/2;y+=grid){ctx.beginPath();ctx.moveTo(-W/2,y);ctx.lineTo(W/2,y);ctx.stroke()}
for(let i=0;i<160;i++){let x=((i*137)%1800)-900-camera.x*.12,y=((i*83)%1800)-900-camera.y*.12;if(x>-W/2&&x<W/2&&y>-H/2&&y<H/2){ctx.fillStyle=i%7?'rgba(120,100,150,.12)':'rgba(205,170,255,.35)';ctx.fillRect(x,y,1.5,1.5)}}
ctx.translate(-camera.x,-camera.y);
for(let g of gems){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.phase);ctx.fillStyle='#78cfff';ctx.shadowBlur=12;ctx.shadowColor='#55baff';ctx.beginPath();ctx.moveTo(0,-g.r);ctx.lineTo(g.r*.7,0);ctx.lineTo(0,g.r);ctx.lineTo(-g.r*.7,0);ctx.closePath();ctx.fill();ctx.restore()}
for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);if(e.boss){ctx.fillStyle=e.hit?'#f4a0be':'#60304a';ctx.beginPath();ctx.ellipse(0,8,38,30,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4d263d';ctx.beginPath();ctx.moveTo(-32,-5);ctx.lineTo(-43,-38);ctx.lineTo(-17,-23);ctx.closePath();ctx.moveTo(32,-5);ctx.lineTo(43,-38);ctx.lineTo(17,-23);ctx.fill();ctx.fillStyle='#f0d58a';ctx.fillRect(-19,-5,5,5);ctx.fillRect(14,-5,5,5)}else{ctx.fillStyle=e.hit?'#d596aa':'#6b3d58';ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bc9eb1';ctx.fillRect(-e.r*.45,-e.r*.1,3,3);ctx.fillRect(e.r*.25,-e.r*.1,3,3)}ctx.restore()}
for(let p of projectiles){ctx.fillStyle='#dfeaff';ctx.shadowBlur=14;ctx.shadowColor='#a58cff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
if(player.orbit)for(let i=0;i<player.orbit;i++){let a=time*2+i*Math.PI*2/player.orbit,x=player.x+Math.cos(a)*55,y=player.y+Math.sin(a)*55;ctx.fillStyle='#bcecff';ctx.shadowBlur=12;ctx.shadowColor='#7ce8ff';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#15132a';ctx.beginPath();ctx.ellipse(0,12,15,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7c5eb1';ctx.beginPath();ctx.moveTo(-11,-2);ctx.lineTo(-14,20);ctx.lineTo(14,20);ctx.lineTo(11,-2);ctx.closePath();ctx.fill();ctx.fillStyle='#d8b69b';ctx.beginPath();ctx.arc(0,-5,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17121e';ctx.beginPath();ctx.moveTo(-11,-8);ctx.quadraticCurveTo(0,-21,11,-8);ctx.lineTo(8,-12);ctx.quadraticCurveTo(0,-18,-8,-12);ctx.fill();ctx.restore();ctx.restore();
ctx.fillStyle='rgba(100,20,40,.35)';ctx.fillRect(0,0,W,H*(1-player.hp/player.maxHp)*.12);
let hpW=180,hpx=W/2-hpW/2,hpy=H-24;ctx.fillStyle='rgba(8,7,15,.85)';ctx.fillRect(hpx,hpy,hpW,7);ctx.fillStyle='#c95c72';ctx.fillRect(hpx,hpy,hpW*(player.hp/player.maxHp),7);
document.getElementById('xp').style.width=(xp/xpNeed*100)+'%';document.getElementById('level').textContent=level;document.getElementById('damage').textContent=Math.round(player.damage);document.getElementById('speed').textContent=Math.round(player.speed/12);document.getElementById('health').textContent=Math.ceil(player.hp);document.getElementById('kills').textContent='KILLS '+kills;document.getElementById('timer').textContent=formatTime(time)}
function loop(now){let dt=Math.min((now-last)/1000,.033);last=now;if(running&&!paused)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
