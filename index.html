<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let state='menu',last=0,time=0,kills=0,level=1,xp=0,xpNeed=25,shake=0,clock=0,boss=null,autoSpawn=0;
const player={x:0,y:0,r:13,hp:100,maxHp:100,speed:145,inv:0,damage:15,fire:900,range:270,projectile:1,pierce:1,regen:0,dashCd:0};
let enemies=[],orbs=[],shots=[],slashes=[],particles=[],texts=[];const keys={};addEventListener('keydown',e=>{keys[e.key.toLowered?e.key.toLowered():e.key.toLowerCase()]=true;if(e.code==='Space')dash()});addEventListener('keyup',e=>keys[e.key.toLowered?e.key.toLowered():e.key.toLowerCase()]=false);

function dash(){if(state!=='running'||player.dashCd>0)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(!dx&&!dy)return;let l=Math.hypot(dx,dy);player.x+=dx/l*90;player.y+=dy/l*90;player.inv=0.55;player.dashCd=4;shake=5;for(let i=0;i<12;i++)particles.push({x:player.x,y:player.y,vx:(Math.random-.5)*160,vy:(Math.random-.5)*160,life:.5,max:.5,c:'#bfe2b0'})}
document.getElementById('dash').onclick=dash;
let joy={x:0,y:0,id:null};const joyel=document.getElementById('joy'),stick=document.getElementById('stick');joyel.addEventListener('pointerdown',e=>{joy.id=e.pointerId;joyel.setPointerCapture(e.pointerId);updateJoy(e)});joyel.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)updateJoy(e)});function updateJoy(e){let r=joyel.getBoundingRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),m=36;if(l>m){dx=dx/l*m;dy=dy/l*m}stick.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/m;joy.y=dy/m}joyel.addEventListener('pointerup',()=>{joy.x=joy.y=0;stick.style.transform='';joy.id=null});
function start(){enemies=[];orbs=[];shots=[];slashes=[];particles=[];texts=[];time=0;kills=0;level=1;xp=0;xpNeed=25;boss=null;player.x=0;player.y=0;player.hp=player.maxHp=100;player.speed=145;player.damage=15;player.fire=900;player.range=270;player.projectile=1;player.pierce=1;player.regen=0;player.dashCd=0;state='running';document.getElementById('menu').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');document.getElementById('levelup').classList.add('hidden');document.querySelector('.boss').style.display='none';updateUI()}
document.getElementById('start').onclick=start;document.getElementById('restart').onclick=start;
function spawn(){let side=Math.floor(Math.random()*4),dist=Math.max(W,H)*.65,x,y;if(side===0){x=player.x-dist;y=player.y+(Math.random-.5)*dist*2}else if(side===1){x=player.x+dist;y=player.y+(Math.random-.5)*dist*2}else if(side===2){x=player.x+(Math.random-.5)*dist*2;y=player.y-dist}else{x=player.x+(Math.random-.5)*dist*2;y=player.y+dist}let big=time>45&&Math.random()<.12,swift=time>20&&Math.random()<.18;enemies.push({x,y,r:big?19:swift?8:12,hp:big?140:swift?22:35+time*.55,maxHp:big?140:swift?22:35+time*.55,speed:(big?28:swift?95:38)+time*.12,type:big?'brute':swift?'wisp':'ghoul',hit:0})}
let shotTimer=0,slashTimer=0,fxCamera={x:0,y:0};
function update(dt){if(state!=='running')return;time+=dt;player.dashCd=Math.max(0,player.dashCd-dt);player.inv=Math.max(0,player.inv-dt);player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+(joy.x||0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+(joy.y||0),l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}player.x+=dx*player.speed*dt;player.y+=dy*player.speed*dt;
autoSpawn-=dt;if(autoSpawn<=0){autoSpawn=Math.max(.18,.9-time*.002);spawn()}if(time>60&&!boss){boss={x:player.x+(Math.random()<.5?-600:600),y:player.y+(Math.random()<.5?-600:600),r:42,hp:1800,maxHp:1800,speed:34,hit:0};enemies.push({...boss,type:'boss'});document.querySelector('.boss').style.display='block'}
shotTimer-=dt*1000;if(shotTimer<=0){let target=null,best=player.range;if(!boss){for(const e of enemies){let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<best){best=d;target=e}}}else target=enemies.find(e=>e.type==='boss')||null;if(target){let a=Math.atan2(target.y-player.y,target.x-player.x);for(let i=0;i<player.projectile;i++){let off=(i-(player.projectile-1)/2)*.16,aa=a+off;shots.push({x:player.x,y:player.y,vx:Math.cos(aa)*330,vy:Math.sin(aa)*330,r:5,life:2.5,pierce:player.pierce,damage:player.damage})}}shotTimer=player.fire}slashTimer-=dt*1000;if(slashTimer<=0){slashTimer=620;slashes.push({x:player.x,y:player.y,r:58,life:.24,max:.24,damage:9})}
for(let i=slashes.length-1;i>=0;i--){let s=slashes[i];s.life-=dt;if(s.life<=0){slashes.splice(i,1);continue}for(const e of enemies){if(!e.hitSl&&Math.hypot(e.x-s.x,e.y-s.y)<e.r+s.r){e.hitSl=true;e.hp-=s.damage;particles.push({x:e.x,y:e.y,vx:0,vy:-20,life:.4,max:.4,c:'#efe1a4'})}}}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0||Math.hypot(s.x-player.x,s.y-player.y)>650){shots.splice(i,1);continue}let remove=false;for(const e of enemies){if(Math.hypot(s.x-e.x,s.y-e.y)<s.r+e.r){e.hp-=s.damage;e.hit=.12;for(let n=0;n<4;n++)particles.push({x:s.x,y:s.y,vx:(Math.random-.5)*100,vy:(Math.random-.5)*100,life:.35,max:.35,c:'#83cbd1'});s.pierce--;if(s.pierce<0)remove=true;break}}if(remove)shots.splice(i,1)}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];let a=Math.atan2(player.y-e.y,player.x-e.x);e.hit=Math.max(0,e.hit-dt);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r&&player.inv<=0){player.hp-=e.type==='boss'?22:e.type==='brute'?16:9;player.inv=.6;shake=8;texts.push({x:player.x,y:player.y-20,text:'-'+(e.type==='boss'?22:e.type==='brute'?16:9),life:.7,max:.7,c:'#f0a080'})}if(e.hp<=0){kills++;let val=e.type==='boss'?100:e.type==='brute'?12:6;for(let n=0;n<(e.type==='boss'?30:5);n++)particles.push({x:e.x,y:e.y,vx:(Math.random-.5)*150,vy:(Math.random-.5)*150,life:.6+Math.random*.5,max:1.1,c:e.type==='boss'?'#b5c96b':'#77916d'});orbs.push({x:e.x,y:e.y,val,r:4});enemies.splice(i,1);if(e.type==='boss'){boss=null;document.querySelector('.boss').style.display='none';win()}}}
for(let i=orbs.length-1;i>=0;i--){let o=orbs[i],d=Math.hypot(player.x-o.x,player.y-o.y);if(d<120){let a=Math.atan2(player.y-o.y,player.x-o.x);o.x+=Math.cos(a)*330*dt;o.y+=Math.sin(a)*330*dt}if(Math.hypot(player.x-o.x,player.y-o.y)<18){xp+=o.val;if(xp>=xpNeed){xp-=xpNeed;xpNeed=Math.floor(xpNeed*1.22);level++;openLevel()}orbs.splice(i,1)}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].y-=25*dt;texts[i].life-=dt;if(texts[i].life<=0)texts.splice(i,1)}shake*=.82;if(player.hp<=0)end(false);updateUI()}
function openLevel(){state='paused';document.getElementById('levelup').classList.remove('hidden');let list=[['☄','Starfire','+40% attack damage','damage'],['❄','Frost Aim','+2 projectiles','multi'],['✥','Ironbark','+25 maximum health','health'],['♢','Hunter’s Speed','+12% movement speed','speed'],['◉','Soul Ring','Regenerate 1.5 health/sec','regen'],['◆','Long Shot','+35% projectile range','range']];let shuffled=list.sort(()=>Math.random-.5).slice(0,3),cards=document.getElementById('cards');cards.innerHTML='';for(const x of shuffled){let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="icon">${x[0]}</div><h3>${x[1]}</h3><span>${x[2]}</span><small>Take blessing</small>`;c.onclick=()=>{if(x[3]==='damage')player.damage*=1.4;if(x[3]==='multi')player.projectile++;if(x[3]==='health'){player.maxHp+=25;player.hp+=25}if(x[3]==='speed')player.speed*=1.12;if(x[3]==='regen')player.regen+=1.5;if(x[3]==='range')player.range*=1.35;document.getElementById('levelup').classList.add('hidden');state='running'};cards.appendChild(c)}}
function win(){state='ended';document.getElementById('gameover').classList.remove('hidden');document.getElementById('endtag').textContent='The dawn breaks over Thornhold';document.getElementById('endtitle').textContent='Victory';document.getElementById('endreason').textContent=`You defeated ${kills} creatures in ${fmt(time)}.`}
function end(){state='ended';document.getElementById('gameover').classList.remove('hidden');document.getElementById('endtag').textContent='The wilds claimed another';document.getElementById('endtitle').textContent='Fallen';document.getElementById('endreason').textContent=`Survived ${fmt(time)} • ${kills} defeated`}
function fmt(s){let m=Math.floor(s/60),ss=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function updateUI(){document.getElementById('xp').style.width=(xp/xpNeed*100)+'%';document.getElementById('level').textContent=level;document.getElementById('hpfill').style.width=(Math.max(0,player.hp)/player.maxHp*100)+'%';document.getElementById('hptext').textContent=Math.ceil(Math.max(0,player.hp))+' / '+player.maxHp;document.getElementById('timer').textContent=fmt(time);document.getElementById('kills').textContent=kills+' defeated';let w=document.getElementById('weapons');w.innerHTML=`<div class="weapon">☄<small>${level}</small></div><div class="weapon">❄<small>${player.projectile}</small></div><div class="weapon">✥<small>${player.projectile>2?'II':'I'}</small></div>`;if(boss){let be=enemies.find(e=>e.type==='boss');if(be)document.getElementById('bossfill').style.width=(be.hp/be.maxHp*100)+'%'}}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();let sx=(Math.random-.5)*shake,sy=(Math.random-.5)*shake;ctx.translate(W/2-player.x+sx,H/2-player.y+sy);
// forest ground
ctx.fillStyle='#17261c';ctx.fillRect(player.x-W,player.y-H,W*3,H*3);for(let gx=-Math.ceil(W)-100;gx<W+100;gx+=60){for(let gy=-Math.ceil(H)-100;gy<H+100;gy+=60){let wx=Math.floor((player.x-W/2+gx)/60)*60,wy=Math.floor((player.y-H/2+gy)/60)*60;ctx.fillStyle=((wx/60+wy/60)&1)?'#19291f':'#1b2b21';ctx.fillRect(wx,wy,60,60)}}
// paths and stones
ctx.globalAlpha=.25;ctx.strokeStyle='#9b9667';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-500,player.y+180);ctx.bezierCurveTo(-200,80,240,-180,800,20);ctx.stroke();ctx.globalAlpha=1;
// scenery
for(let i=-8;i<9;i++)for(let j=-7;j<8;j++){let x=i*180+((j&1)*90),y=j*170;let n=((i*738+j*431)%19);if(n>11){ctx.fillStyle='#0d1711';ctx.fillRect(x-12,y-36,24,42);ctx.fillStyle='#22392a';ctx.beginPath();ctx.arc(x,y-36,18+n*.8,0,7);ctx.fill();ctx.fillStyle='#31503a';ctx.beginPath();ctx.arc(x-7,y-43,9,0,7);ctx.fill()}}
// orbs
for(const o of orbs){ctx.fillStyle='#88dcb8';ctx.shadowColor='#74d7ab';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill()}ctx.shadowBlur=0;
// enemy shadow and bodies
for(const e of enemies){ctx.fillStyle='#070d09';ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.75,e.r*1.15,e.r*.45,0,0,7);ctx.fill();ctx.globalAlpha=1;let col=e.type==='brute'?'#5a493a':e.type==='wisp'?'#534a72':'#4a5f45';ctx.fillStyle=e.hit?'#d6aa91':col;ctx.strokeStyle='#182018';ctx.lineWidth=2;if(e.type==='wisp'){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#a2c0bf';ctx.beginPath();ctx.arc(e.x-3,e.y-3,2,0,7);ctx.fill();ctx.beginPath();ctx.arc(e.x+4,e.y-3,2,0,7);ctx.fill()}else if(e.type==='boss'){ctx.fillStyle='#2d3a27';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#4f6542';for(let k=0;k<8;k++){let a=k*Math.PI/4;ctx.beginPath();ctx.arc(e.x+Math.cos(a)*34,e.y+Math.sin(a)*34,12,0,7);ctx.fill()}ctx.fillStyle='#d17d55';ctx.beginPath();ctx.arc(e.x-14,e.y-8,4,0,7);ctx.fill();ctx.beginPath();ctx.arc(e.x+14,e.y-8,4,0,7);ctx.fill()}else{ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#9da66e';ctx.beginPath();ctx.arc(e.x-4,e.y-4,2,0,7);ctx.fill();ctx.beginPath();ctx.arc(e.x+4,e.y-4,2,0,7);ctx.fill();ctx.strokeStyle='#263126';ctx.beginPath();ctx.moveTo(e.x-e.r*.5,e.y+e.r*.3);ctx.lineTo(e.x-e.r*.9,e.y+e.r*.8);ctx.moveTo(e.x+e.r*.5,e.y+e.r*.3);ctx.lineTo(e.x+e.r*.9,e.y+e.r*.8);ctx.stroke()}}
