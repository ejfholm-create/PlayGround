<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ASHES OF TARTARUS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@600;700&display=swap');
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090711;color:#eee;font-family:Inter,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#ui{position:fixed;inset:0;pointer-events:none}
.topbar{position:absolute;left:24px;right:24px;top:18px;display:flex;justify-content:space-between;align-items:flex-start}
.room{font-family:Cinzel,serif;text-align:center;text-shadow:0 2px 10px #000}.room small{display:block;color:#a9a1ba;font-size:11px;letter-spacing:3px}.room b{font-size:20px;letter-spacing:2px}
.health{width:245px}.hp-row{display:flex;gap:8px}.heart{font-size:25px;color:#f04b58;text-shadow:0 0 12px #c62443}.heart.empty{color:#402d43;opacity:.75}.soul{margin-top:7px;color:#d6cbf8;font-family:Cinzel,serif;font-size:13px}.soul i{color:#9d82ff;font-style:normal}
#bossName{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-family:Cinzel,serif;font-size:14px;letter-spacing:3px;color:#ffb3bd;display:none}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);padding:9px 16px;border:1px solid #8166a8;border-radius:2px;background:rgba(17,10,32,.92);font-family:Cinzel,serif;opacity:0;transition:.25s;text-align:center}
#toast.show{opacity:1}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(73,43,99,.55),rgba(8,7,17,.94));pointer-events:auto;z-index:20}.panel.hidden{display:none}
.cardbox{width:min(840px,92vw);text-align:center}.eyebrow{color:#c3b7d8;font-family:Cinzel,serif;font-size:12px;letter-spacing:5px}.title{font-family:Cinzel,serif;font-size:clamp(36px,7vw,74px);line-height:.9;margin:14px 0 9px;text-shadow:0 4px 20px #000}.subtitle{color:#b8afc7;margin:0 0 28px}
.weapons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.weapon{height:220px;border:1px solid #554564;background:linear-gradient(160deg,rgba(45,34,67,.94),rgba(15,12,28,.96));color:#eee;padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:.18s}.weapon:hover{transform:translateY(-5px);border-color:#d6aaff;box-shadow:0 12px 40px #4d287c55}.weapon.selected{border-color:#dcb7ff}.icon{height:78px;display:flex;align-items:center;justify-content:center;font-size:55px;text-shadow:0 0 22px currentColor}.weapon:nth-child(1) .icon{color:#58cff5}.weapon:nth-child(2) .icon{color:#efc56c}.weapon:nth-child(3) .icon{color:#c382ff}.weapon h2{font-family:Cinzel,serif;font-size:19px;margin:8px 0 5px}.weapon p{font-size:12px;color:#aaa2b6;margin:0 0 13px}.weapon em{font-style:normal;color:#d4c1ef;font-size:11px}.primary{margin-top:26px;border:1px solid #ad91cd;background:#39294f;color:white;font-family:Cinzel,serif;padding:12px 38px;cursor:pointer;font-size:16px}.primary:hover{background:#563a74}
#upgradePanel .cardbox{width:min(980px,94vw)}.boons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.boon{height:210px}.boon .icon{height:60px;font-size:44px}.boon h2{font-size:16px}.boon p{line-height:1.5}
.controls{position:absolute;right:22px;bottom:18px;color:#aaa;font-size:10px;text-align:right;line-height:1.7}.controls b{color:#ddd}
#touch{display:none;position:absolute;inset:0;pointer-events:none}.stick,.attackTouch{position:absolute;bottom:25px;width:105px;height:105px;border:1px solid rgba(255,255,255,.15);border-radius:50%;background:rgba(30,22,45,.24);pointer-events:auto}.stick{left:20px}.stick .knob{position:absolute;width:44px;height:44px;border-radius:50%;left:30px;top:30px;background:rgba(221,210,242,.25)}.attackTouch{right:24px;border-color:rgba(232,196,111,.28)}.attackTouch:after{content:'⚔';position:absolute;inset:0;display:grid;place-items:center;font-size:39px;color:#dac79a}
.dashTouch{position:absolute;right:138px;bottom:28px;width:72px;height:72px;border-radius:50%;border:1px solid rgba(150,205,255,.25);background:rgba(30,22,45,.24);pointer-events:auto;display:grid;place-items:center;color:#9ed0ee}
@media(max-width:700px){.topbar{left:12px;right:12px}.health{width:160px}.heart{font-size:18px}.room b{font-size:14px}.room small{font-size:8px}.controls{display:none}.weapon{height:175px;padding:10px}.icon{height:55px;font-size:38px}.weapon h2{font-size:13px}.weapon p{font-size:9px}.cardbox{width:96vw}.subtitle{margin-bottom:14px}.primary{margin-top:14px}.boon{height:175px}.boon h2{font-size:12px}.boon p{font-size:9px}#touch{display:block}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="ui">
 <div class="topbar"><div class="health"><div id="hp" class="hp-row"></div><div class="soul">OBOL <i id="obol">0</i></div></div><div class="room"><small>CHAMBER</small><b id="roomName">THE ASPHODEL FIELDS</b></div><div style="width:245px"></div></div>
 <div id="bossName">ELDER SHADE</div><div id="toast"></div>
 <div class="controls"><b>WASD</b> MOVE &nbsp; <b>MOUSE</b> AIM<br><b>CLICK / J</b> ATTACK &nbsp; <b>SPACE / K</b> DASH</div>
</div>
<div id="start" class="panel"><div class="cardbox"><div class="eyebrow">A DESCENT BEGINS</div><div class="title">Choose Your Aspect</div><p class="subtitle">Three weapons. One way out.</p><div class="weapons">
<button class="weapon" data-w="blade"><div class="icon">✦</div><h2>Stygian Blade</h2><p>Balanced cuts with a sweeping special</p><em>ASPECT OF ARISTA — QUICK</em></button>
<button class="weapon" data-w="bow"><div class="icon">➶</div><h2>Heart-Seeking Bow</h2><p>Rapid arrows pierce the darkness</p><em>ASPECT OF RAMA — DISTANT</em></button>
<button class="weapon" data-w="shield"><div class="icon">◉</div><h2>Aegis Shield</h2><p>Brutal rush attacks and bashes</p><em>ASPECT OF CHAOS — FORCE</em></button>
 </div><button id="begin" class="primary">DESCEND</button></div></div>
<div id="upgradePanel" class="panel hidden"><div class="cardbox"><div class="eyebrow">THE UNDERWORLD OFFERS</div><div class="title" style="font-size:50px">Choose a Boon</div><div class="boons" id="boons"></div></div></div>
<div id="touch"><div class="stick" id="stick"><div class="knob"></div></div><div class="dashTouch" id="dashTouch">DASH</div><div class="attackTouch" id="attackTouch"></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let choice='blade',started=false,paused=false,gameOver=false,room=1,obol=0,last=0,shake=0;
const keys={},mouse={x:W/2,y:H/2,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){keys.dash=true}if(e.key.toLowerCase()==='j')mouse.down=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')keys.dash=false;if(e.key.toLowerCase()==='j')mouse.down=false});
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
document.querySelectorAll('.weapon').forEach(b=>b.onclick=()=>{document.querySelectorAll('.weapon').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');choice=b.dataset.w});document.querySelector('.weapon').classList.add('selected');
const player={x:0,y:0,r:15,hp:5,maxHp:5,speed:210,atk:1,fire:0,inv:0,dash:0,dashCd:0,weapon:'blade',angle:0};let enemies=[],projectiles=[],particles=[],slashes=[],obols=[];
function resetRoom(){player.x=W/2;player.y=H/2;enemies=[];projectiles=[];slashes=[];obols=[];let count=room===5?1:4+room;for(let i=0;i<count;i++)spawnEnemy(room===5?'boss':i%3?'shade':'brute')} 
function spawnEnemy(type){let a=Math.random()*Math.PI*2,d=Math.min(W,H)*.35;let x=W/2+Math.cos(a)*d,y=H/2+Math.sin(a)*d*.7;if(type==='boss')enemies.push({type,x,y,r:34,hp:55+room*8,maxHp:55+room*8,speed:52,fire:2,angle:0,hit:0});else if(type==='brute')enemies.push({type,x,y,r:21,hp:7+room*2,maxHp:7+room*2,speed:45,fire:1.5,angle:0,hit:0});else enemies.push({type,x,y,r:15,hp:4+room,maxHp:4+room,speed:75+room*4,fire:2,angle:0,hit:0})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function burst(x,y,c,n=8){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=Math.random()*120+30;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.5,c,r:1+Math.random()*3})}}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.classList.remove('show'),1700)}
function start(){started=true;gameOver=false;room=1;obol=0;player.weapon=choice;player.hp=player.maxHp;document.getElementById('start').classList.add('hidden');resetRoom();toast('ROOM I — THE ASHEN GATE')}document.getElementById('begin').onclick=start;
function update(dt){if(!started||paused||gameOver)return;dt=Math.min(dt,.033);player.inv=Math.max(0,player.inv-dt);player.dashCd=Math.max(0,player.dashCd-dt);player.fire=Math.max(0,player.fire-dt);
let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let ml=Math.hypot(mx,my)||1;if(touchMove.x||touchMove.y){mx=touchMove.x;my=touchMove.y;ml=Math.max(1,Math.hypot(mx,my))}if(player.dash>0){player.dash-=dt;mx=player.dx;my=player.dy;player.inv=.12}else if(keys.dash&&player.dashCd<=0&&ml>0){player.dash=.16;player.dashCd=.65;player.dx=mx/ml;player.dy=my/ml;burst(player.x,player.y,'#a9ceff',10)}
player.x+=mx/ml*player.speed*(player.dash>0?2.7:1)*dt;player.y+=my/ml*player.speed*(player.dash>0?2.7:1)*dt;let pad=70;player.x=Math.max(pad,Math.min(W-pad,player.x));player.y=Math.max(pad,Math.min(H-pad,player.y));player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);if(touchAim.active){player.angle=Math.atan2(touchAim.y,touchAim.x)}
if((mouse.down||keys.j)&&player.fire<=0)attack();
for(let e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x),d=Math.hypot(player.x-e.x,player.y-e.y);e.angle=a;e.hit=Math.max(0,e.hit-dt);e.fire-=dt;if(e.type==='shade'&&d>150){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}else if(d>e.r+player.r+8){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}else if(player.inv<=0&&player.dash<=0){hurt(e)}
if(e.type==='shade'&&e.fire<=0&&d<430){let ba=Math.atan2(player.y-e.y,player.x-e.x);projectiles.push({x:e.x,y:e.y,vx:Math.cos(ba)*190,vy:Math.sin(ba)*190,r:6,life:4,enemy:true,c:'#e45f70'});e.fire=1.7}else if(e.type==='brute'&&e.fire<=0&&d<95){hurt(null);e.fire=1.2}else if(e.type==='boss'&&e.fire<=0){for(let k=-2;k<=2;k++){let ba=a+k*.18;projectiles.push({x:e.x,y:e.y,vx:Math.cos(ba)*170,vy:Math.sin(ba)*170,r:8,life:5,enemy:true,c:'#ff5f78'})}e.fire=1.1}}
for(let p of projectiles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.enemy&&dist(p,player)<p.r+player.r&&player.inv<=0&&player.dash<=0)hurt(null,p)}
for(let s of slashes){s.life-=dt;s.x=player.x+Math.cos(s.angle)*30;s.y=player.y+Math.sin(s.angle)*30}
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt}
obols=obols.filter(o=>{if(dist(o,player)<35){obol+=o.val;return false}o.life-=dt;return o.life>0});projectiles=projectiles.filter(p=>p.life>0&&p.x>-30&&p.x<W+30&&p.y>-30&&p.y<H+30);slashes=slashes.filter(s=>s.life>0);particles=particles.filter(p=>p.life>0);
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.hp<=0){burst(e.x,e.y,e.type==='boss?'#e45a80':'#77d1de',e.type==='boss'?35:12);for(let k=0;k<(e.type==='boss'?8:2);k++)obols.push({x:e.x+(Math.random()-.5)*40,y:e.y+(Math.random()-.5)*40,val:e.type==='boss'?12:1,life:8});enemies.splice(i,1)}}
if(enemies.length===0&&started&&obols.length>=0&&!paused){clearRoom()}
document.getElementById('hp').innerHTML=Array.from({length:player.maxHp},(_,i)=>'<span class="heart '+(i>=player.hp?'empty':'')+'">♥</span>').join('');document.getElementById('obol').textContent=obol;shake*=.88}
let clearing=false;function clearRoom(){if(clearing)return;clearing=true;if(room>=5){setTimeout(()=>{gameOver=true;started=false;showEnd(true)},500)}else{setTimeout(()=>{paused=true;showUpgrade()},700)}}
function hurt(e,p){if(player.inv>0)return;player.hp--;player.inv=1;shake=8;burst(player.x,player.y,'#ef4e64',14);if(p)p.life=0;if(player.hp<=0){gameOver=true;started=false;showEnd(false)}}
function attack(){player.fire=choice==='blade'?0.38:choice==='bow'?0.28:.55;if(choice==='blade'){slashes.push({x:player.x,y:player.y,angle:player.angle,life:.18,hit:false});let arc=.95;for(let e of enemies){let a=Math.atan2(e.y-player.y,e.x-player.x),delta=Math.atan2(Math.sin(a-player.angle),Math.cos(a-player.angle));if(dist(e,player)<88&&Math.abs(delta)<arc){damage(e,3)}}burst(player.x+Math.cos(player.angle)*52,player.y+Math.sin(player.angle)*52,'#75d9f5',4)}else if(choice==='bow'){projectiles.push({x:player.x+Math.cos(player.angle)*20,y:player.y+Math.sin(player.angle)*20,vx:Math.cos(player.angle)*520,vy:Math.sin(player.angle)*520,r:5,life:1.8,enemy:false,c:'#f5cb72',pierce:1})}else{slashes.push({x:player.x,y:player.y,angle:player.angle,life:.22,hit:false});player.dash=.12;player.dx=Math.cos(player.angle);player.dy=Math.sin(player.angle);for(let e of enemies){let a=Math.atan2(e.y-player.y,e.x-player.x),d=Math.atan2(Math.sin(a-player.angle),Math.cos(a-player.angle));if(dist(e,player)<82&&Math.abs(d)<1){damage(e,4)}}burst(player.x+Math.cos(player.angle)*50,player.y+Math.sin(player.angle)*50,'#b58cff',8)}}
for(let p of projectiles){if(!p.enemy&&p.pierce!==undefined){for(let e of enemies){if(dist(p,e)<p.r+e.r){damage(e,2);p.pierce--;if(p.pierce<0)p.life=0;burst(p.x,p.y,'#f1b95e',3)}}}}
function damage(e,n){e.hp-=n;e.hit=.12;let a=Math.atan2(e.y-player.y,e.x-player.x);e.x+=Math.cos(a)*18;e.y+=Math.sin(a)*18;burst(e.x,e.y,'#b9edf5',5)}
function showUpgrade(){let names=[['Zeus','⚡','Chain Lightning','Your attacks may arc 35 damage to nearby foes.'],['Aphrodite','♥','Crimson Wave','Gain one max health and restore all health.'],['Athena','◆','Divine Strike','Deal 25% more damage.']];let el=document.getElementById('boons');el.innerHTML=names.map((n,i)=>`<button class="weapon boon" data-b="${i}"><div class="icon">${n[1]}</div><h2>${n[0]} · ${n[2]}</h2><p>${n[3]}</p></button>`).join('');document.getElementById('upgradePanel').classList.remove('hidden');el.querySelectorAll('.boon').forEach(b=>b.onclick=()=>{let i=+b.dataset.b;if(i===1){player.maxHp++;player.hp=player.maxHp}else if(i===2){player.atk*=1.25}else{}document.getElementById('upgradePanel').classList.add('hidden');paused=false;clearing=false;room++;roomNames();resetRoom();toast(room===5?'FINAL CHAMBER — THE HYDRA':'ROOM '+['II','III','IV','V'][room-2]+' — DESCEND')})}
function roomNames(){document.getElementById('roomName').textContent=room===5?'THE HYDRA’S LAIR':['THE ASHEN GATE','THE COLOSSEUM','THE RIVER OF STYX','THE JUDGEMENT HALL','THE HYDRA’S LAIR'][room-1];document.getElementById('bossName').style.display=room===5?'block':'none'}
function showEnd(win){paused=true;let p=document.getElementById('start');p.classList.remove('hidden');p.querySelector('.eyebrow').textContent=win?'THE NIGHT HAS ENDED':'THE WILD FLAMES CONSUME';p.querySelector('.title').textContent=win?'You Escaped':'Death Claims You';p.querySelector('.subtitle').textContent=win?'You reached the surface, for now.':'The Underworld remembers every attempt.';document.getElementById('begin').textContent='TRY AGAIN'}

function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,Math.max(W,H)*.65);g.addColorStop(0,'#342443');g.addColorStop(.55,'#1a1527');g.addColorStop(1,'#090713');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();if(shake>1)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
ctx.globalAlpha=.18;ctx.strokeStyle='#a58cb4';ctx.lineWidth=1;for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;
ctx.fillStyle='#090813';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,58);ctx.lineTo(W*.82,58);ctx.lineTo(W*.82,82);ctx.lineTo(W*.18,82);ctx.lineTo(W*.18,58);ctx.lineTo(0,58);ctx.fill();
// arena pillars
ctx.fillStyle='#17101f';for(let x=95;x<W-80;x+=Math.max(180,(W-190)/4)){ctx.fillRect(x,95,46,48);ctx.fillRect(x,95,46,7);ctx.fillStyle='#2b2037';ctx.fillRect(x-5,88,56,9);ctx.fillStyle='#17101f'}
for(let o of obols){ctx.fillStyle='#76ebcf';ctx.shadowBlur=12;ctx.shadowColor='#76ebcf';ctx.beginPath();ctx.arc(o.x,o.y,5,0,7);ctx.fill();ctx.shadowBlur=0}
for(let s of slashes){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);ctx.strokeStyle=choice==='bow'?'#dcb765':choice==='shield'?'#bd91ff':'#80dff6';ctx.lineWidth=choice==='shield'?10:6;ctx.shadowBlur=14;ctx.shadowColor=ctx.strokeStyle;ctx.beginPath();ctx.arc(0,0,choice==='shield'?42:48,-.9,.9);ctx.stroke();ctx.restore()}
for(let p of projectiles){ctx.fillStyle=p.c;ctx.shadowBlur=10;ctx.shadowColor=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.shadowBlur=0}
for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.angle);let col=e.hit>0?'#fff':e.type==='boss'?'#7c3148':e.type==='brute'?'#9b4d5a':'#4ba2a8';ctx.fillStyle=col;ctx.shadowBlur=e.type==='boss'?20:8;ctx.shadowColor=col;ctx.beginPath();if(e.type==='boss'){ctx.moveTo(-28,-28);ctx.lineTo(28,-28);ctx.lineTo(34,22);ctx.lineTo(0,36);ctx.lineTo(-34,22)}else{ctx.moveTo(-e.r,-e.r*.7);ctx.lineTo(e.r,0);ctx.lineTo(-e.r,e.r*.7)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#efdae1';ctx.beginPath();ctx.arc(5,0,3,0,7);ctx.fill();ctx.restore();if(e.hp<e.maxHp){ctx.fillStyle='#351a26';ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,4);ctx.fillStyle='#ea697e';ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2*(e.hp/e.maxHp),4)}}
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle=player.inv>0&&Math.floor(player.inv*10)%2?'#88b9ff':'#d7c7e8';ctx.shadowBlur=12;ctx.shadowColor='#b9a0df';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,-12);ctx.lineTo(-7,12);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(player.x,player.y,5,0,7);ctx.fill();ctx.globalAlpha=1;
for(let p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();requestAnimationFrame(loop)}
