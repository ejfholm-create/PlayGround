<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ASHBOUND — Room of Trials</title>
<style>
:root{--ink:#eee5cf;--gold:#dba85a;--blood:#d94b46;--dim:#17141a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09080b;font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}#hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:22px;display:flex;align-items:center;gap:12px}.brand{font-size:12px;letter-spacing:5px;opacity:.8}.room{position:absolute;top:18px;right:25px;text-align:right}.room small{display:block;color:#96887a;font-size:10px;letter-spacing:3px}.room b{font-size:18px;letter-spacing:2px;color:#d7c49f}.health{margin-top:4px}.heart{display:inline-block;color:#d94b46;text-shadow:0 0 12px #8d2825;font-size:23px;margin-right:4px}.heart.empty{color:#4a3838;text-shadow:none}.xp{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#c98e48,#f1d79d);box-shadow:0 0 12px #c98e48}.bottomhint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:11px Arial,sans-serif;letter-spacing:1px;color:#9f9688}.bottomhint kbd{border:1px solid #716656;border-radius:3px;padding:2px 5px;margin:0 3px;color:#ddd1b8}
#choice,#end,#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,7,10,.82);z-index:5;backdrop-filter:blur(5px)}.panel{text-align:center;width:min(860px,92vw)}.panel h1{margin:0 0 8px;font-size:28px;letter-spacing:7px;text-transform:uppercase;font-weight:normal}.panel .sub{color:#aaa08f;font:11px Arial,sans-serif;letter-spacing:4px;margin-bottom:27px}.cards{display:flex;gap:14px;justify-content:center}.card{pointer-events:auto;width:250px;height:280px;background:linear-gradient(145deg,#24202a,#151319);border:1px solid #514838;border-radius:3px;color:var(--ink);padding:28px 20px;cursor:pointer;position:relative;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-7px);border-color:#d2ac70;box-shadow:0 18px 50px #000}.sigil{width:86px;height:86px;margin:0 auto 18px;border:1px solid #776b56;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:radial-gradient(circle,#332b35,#17151b)}.card h2{font-size:19px;margin:8px 0 8px;letter-spacing:2px}.card p{font:12px/1.55 Arial,sans-serif;color:#b1a795;min-height:38px}.tag{position:absolute;bottom:17px;left:0;right:0;color:#c99d62;font:9px Arial,sans-serif;letter-spacing:3px}.hidden{display:none!important}.victory h1{color:#e3bc78}.endbtn{pointer-events:auto;margin-top:24px;background:transparent;border:1px solid #9d8158;color:#dec38e;padding:12px 24px;font:11px Arial,sans-serif;letter-spacing:3px;cursor:pointer}
#mobile{display:none;position:absolute;inset:0;pointer-events:none}#stick,#attack,#dash{position:absolute;pointer-events:auto;border-radius:50%;touch-action:none}.stickbase{width:105px;height:105px;left:22px;bottom:25px;border:1px solid rgba(220,205,172,.25);background:rgba(30,27,34,.3)}#stick:before{content:"";position:absolute;width:48px;height:48px;border-radius:50%;left:28px;top:28px;background:rgba(210,196,168,.28)}#attack{width:78px;height:78px;right:24px;bottom:38px;border:1px solid rgba(220,160,115,.4);background:rgba(110,55,49,.22)}#attack:after{content:"⚔";position:absolute;inset:0;display:grid;place-content:center;font-size:30px;color:#dcbf9b}#dash{width:58px;height:58px;right:112px;bottom:28px;border:1px solid rgba(173,196,196,.35);background:rgba(63,85,88,.18);font:9px Arial;color:#bdd0cc;text-align:center;padding-top:23px}@media(pointer:coarse),(max-width:700px){#mobile{display:block}.bottomhint{display:none}.topbar{top:10px;left:12px}.room{top:10px;right:12px}.card{width:min(250px,28vw);height:250px;padding:18px 8px}.cards{gap:7px}.sigil{width:68px;height:68px;font-size:31px}.card h2{font-size:15px}.card p{font-size:10px}.panel h1{font-size:21px}.brand{display:none}}
</style></head>
<body>
<canvas id="game"></canvas><div id="hud"><div class="topbar"><div class="brand">ASHBOUND</div><div id="health" class="health"></div></div><div class="room"><small>CHAMBER</small><b id="roomname">I · EMBER HALL</b></div><div id="xp" class="xp"></div><div class="bottomhint"><kbd>WASD</kbd> Move &nbsp; <kbd>MOUSE</kbd> Aim / Attack &nbsp; <kbd>SPACE</kbd> Dash</div></div>
<div id="start"><div class="panel"><h1>Choose your gift</h1><div class="sub">THE ASHEN DOORS AWAIT</div><div class="cards" id="cards"></div></div></div>
<div id="choice" class="hidden"><div class="panel"><h1>A boon awaits</h1><div class="sub">PICK ONE · THE CHALLENGE CONTINUES</div><div class="cards" id="boons"></div></div></div>
<div id="end" class="hidden"><div class="panel victory"><h1 id="endtitle">CHAMBER CLEARED</h1><div class="sub" id="endsub">THE ASHES BOW BEFORE YOU</div><button class="endbtn" id="again">DESCEND AGAIN</button></div></div>
<div id="mobile"><div id="stick" class="stickbase"></div><div id="attack"></div><div id="dash">DASH</div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const weapons=[{name:'Mourning Blade',icon:'⚔',tag:'SWIFT · CLOSE RANGE',desc:'Balanced cuts. Quick, precise strikes.',color:'#d8c3a1',cool:320,range:82,dmg:34,kind:'blade'},{name:'Pyre Spear',icon:'♆',tag:'FAR · PIERCING',desc:'Reach through the swarm with a sweeping thrust.',color:'#dc9b62',cool:520,range:125,dmg:44,kind:'spear'},{name:'Cinder Bow',icon:'➶',tag:'RANGED · RAPID',desc:'Loose burning arrows into the heart of the hall.',color:'#a7c5b3',cool:280,range:520,dmg:24,kind:'bow'}];
let state='start',weapon=weapons[0],room=1,score=0,shake=0,last=0;const player={x:0,y:0,r:15,hp:100,max:100,speed:220,inv:0,aim:0,dash:0,dashT:0};let enemies=[],projectiles=[],particles=[],slashes=[],keys={},mouse={x:0,y:0,down:false};
function health(){let s='';for(let i=0;i<5;i++)s+=`<span class="heart ${i>=Math.ceil(player.hp/20)?'empty':''}">♦</span>`;document.getElementById('health').innerHTML=s}health();
function cards(el,arr,cb){el.innerHTML='';arr.forEach((x,i)=>{let d=document.createElement('button');d.className='card';d.innerHTML=`<div class="sigil" style="color:${x.color||'#dba85a'}">${x.icon||'✦'}</div><h2>${x.name}</h2><p>${x.desc}</p><div class="tag">${x.tag}</div>`;d.onclick=()=>cb(x,i);el.appendChild(d)})}
function spawnRoom(){player.x=W/2;player.y=H/2;enemies=[];projectiles=[];slashes=[];let n=5+room*2;for(let i=0;i<n;i++){let a=i/n*Math.PI*2,r=Math.min(W,H)*.38;enemies.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,r:15,hp:room>2?48:38,max:room>2?48:38,speed:58+room*5,type:i%4===0?'brute':'shade',hit:0})}document.getElementById('roomname').textContent=['I · EMBER HALL','II · CRIMSON NAVE','III · BLACK ALTAR','IV · THE CINDER THRONE'][Math.min(room-1,3)]}
cards(document.getElementById('cards'),weapons,(w)=>{weapon=w;document.getElementById('start').classList.add('hidden');state='play';spawnRoom()});
let attackCD=0;
function attack(){if(state!='play'||attackCD>0)return;attackCD=weapon.cool/1000;let dx=Math.cos(player.aim),dy=Math.sin(player.aim);if(weapon.kind==='bow'){projectiles.push({x:player.x+dx*22,y:player.y+dy*22,vx:dx*520,vy:dy*520,r:5,dmg:weapon.dmg,life:1.4,enemy:false,color:'#b9d8b5'})}else{slashes.push({x:player.x+dx*weapon.range*.4,y:player.y+dy*weapon.range*.4,life:.16,max:.16,ang:player.aim,len:weapon.range,width:weapon.kind==='spear'?18:35});for(let e of enemies){let ex=e.x-player.x,ey=e.y-player.y,d=Math.hypot(ex,ey);if(d<weapon.range+e.r&&Math.cos(Math.atan2(ey,ex)-player.aim)>.15){e.hp-=weapon.dmg+(weapon.kind==='spear'?8:0);e.hit=.12;particles.push({x:e.x,y:e.y,vx:-dx*50,vy:-dy*50,life:.25,c:'#e8c184'})}}}
}
function dash(){if(state!='play'||player.dashT>0)return;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(!dx&&!dy){dx=Math.cos(player.aim);dy=Math.sin(player.aim)}let l=Math.hypot(dx,dy)||1;player.dash=Math.atan2(dy/l,dx/l);player.dashT=.32;player.inv=.35}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.prevent;dash()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.down=e.buttons&1});addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
function touchSetup(){let stick=document.getElementById('stick'),joy={id:null,dx:0,dy:0};stick.addEventListener('touchstart',e=>{e.preventDefault();let t=e.changedTouches[0];joy.id=t.identifier;joy.dx=0;joy.dy=0},{passive:false});stick.addEventListener('touchmove',e=>{e.prevent;for(let t of e.changedTouches)if(t.identifier===joy.id){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;joy.dx=(t.clientX-cx)/38;joy.dy=(t.clientY-cy)/38;joy.dx=Math.max(-1,Math.min(1,joy.dx));joy.dy=Math.max(-1,Math.min(1,joy.dy));let knob=stick.querySelector('i');}},{passive:false});stick.addEventListener('touchend',()=>{joy.dx=joy.dy=0});window.touchJoy=joy;document.getElementById('attack').addEventListener('touchstart',e=>{e.preventDefault();mouse.down=true},{passive:false});document.getElementById('attack').addEventListener('touchend',()=>mouse.down=false);document.getElementById('dash').addEventListener('touchstart',e=>{e.preventDefault();dash()},{passive:false})}touchSetup();
const boons=[{name:'Dawn’s Favor',icon:'✦',tag:'COMMON · VITALITY',desc:'Restore 35 health and increase maximum life.',effect:p=>{p.max+=20;p.hp=Math.min(p.max,p.hp+35)}},{name:'Quickened Ash',icon:'◒',tag:'RARE · SPEED',desc:'Move faster and dash through danger.',effect:p=>p.speed+=35},{name:'Serrated Edge',icon:'♠',tag:'RARE · FORCE',desc:'Weapon strikes deal 10 additional damage.',effect:p=>weapon.dmg+=10}];
function update(dt){if(state!='play')return;attackCD=Math.max(0,attackCD-dt);player.inv=Math.max(0,player.inv-dt);player.dashT=Math.max(0,player.dashT-dt);player.aim=Math.atan2(mouse.y-player.y,mouse.x-player.x);if(window.touchJoy&&(window.touchJoy.dx||window.touchJoy.dy)){let j=window.touchJoy;if(Math.abs(j.dx)+Math.abs(j.dy)>0.2)player.aim=Math.atan2(j.dy,j.dx)}let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(window.touchJoy){dx+=(window.touchJoy.dx||0);dy+=(window.touchJoy.dy||0)}let l=Math.hypot(dx,dy)||1;if(player.dashT>0){dx=Math.cos(player.dash);dy=Math.sin(player.dash);l=1}player.x+=dx/l*(player.dashT>0?560:player.speed)*dt;player.y+=dy/l*(player.dashT>0?560:player.speed)*dt;player.x=Math.max(65,Math.min(W-65,player.x));player.y=Math.max(65,Math.min(H-65,player.y));if(mouse.down)attack();
for(let e of enemies){e.hit=Math.max(0,e.hit-dt);let ex=player.x-e.x,ey=player.y-e.y,d=Math.hypot(ex,ey)||1;if(d>28){e.x+=ex/d*e.speed*dt;e.y+=ey/d*e.speed*dt}if(d<e.r+player.r&&player.inv<=0){player.hp-=10;player.inv=.8;shake=8;health();if(player.hp<=0){end(false)}}}
for(let p of projectiles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;for(let e of enemies){if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+p.r){e.hp-=p.dmg;e.hit=.12;p.life=0;for(let i=0;i<5;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,life:.35,c:'#b9d8b5'})}}}projectiles=projectiles.filter(p=>p.life>0&&p.x>0&&p.x<W&&p.y>0&&p.y<H);
for(let s of slashes)s.life-=dt;slashes=slashes.filter(s=>s.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);enemies=enemies.filter(e=>e.hp>0);score=Math.round((1-Math.min(1,player.hp/player.max))*100);document.getElementById('xp').style.width=(100-Math.min(100,score))+'%';if(!enemies.length&&state==='play')clearRoom();}
function clearRoom(){state='transition';if(room>=4){setTimeout(()=>end(true),250)}else{setTimeout(()=>{cards(document.getElementById('boons'),boons,(b)=>{b.effect(player);health();document.getElementById('choice').classList.add('hidden');room++;spawnRoom();state='play'});document.getElementById('choice').classList.remove('hidden')},350)}}
function end(win){state='end';document.getElementById('endtitle').textContent=win?'TRIAL CONQUERED':'YOU HAVE FALLEN';document.getElementById('endsub').textContent=win?'THE ASHES CANNOT HOLD YOU':'THE CHAMBER CLAIMS ANOTHER SOUL'}
document.getElementById('again').onclick=()=>{room=1;player.hp=player.max=100;player.speed=220;weapon.dmg=weapon.kind==='blade'?34:weapon.kind==='spear'?44:24;document.getElementById('end').classList.add('hidden');spawnRoom();state='play'};
function draw(){ctx.clearRect(0,0,W,H);let sx=shake?((Math.random-.5)*shake):0,sy=shake?((Math.random-.5)*shake):0;ctx.save();ctx.translate(sx,sy);shake*=.85;if(shake<.2)shake=0;ctx.fillStyle='#171419';ctx.fillRect(0,0,W,H);ctx.fillStyle='#1d1a20';ctx.fillRect(48,48,W-96,H-96);for(let i=0;i<12;i++){ctx.strokeStyle='rgba(125,104,78,.07)';ctx.lineWidth=1;let x=(i+.5)*W/12;ctx.beginPath();ctx.moveTo(x,55);ctx.lineTo(x,H-55);ctx.stroke()}for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(55,(i+.5)*H/7);ctx.lineTo(W-55,(i+.5)*H/7);ctx.stroke()}ctx.strokeStyle='#5b4b39';ctx.lineWidth=8;ctx.strokeRect(54,54,W-108,H-108);ctx.fillStyle='#b4915b';ctx.fillRect(W/2-28,48,56,10);ctx.fillRect(W/2-28,H-58,56,10);ctx.fillStyle='#241f27';ctx.beginPath();ctx.arc(W/2,H/2,62,0,7);ctx.fill();ctx.strokeStyle='#3c323d';ctx.lineWidth=2;ctx.stroke();for(let i=0;i<8;i++){let a=i/8*Math.PI*2;ctx.beginPath();ctx.arc(W/2+Math.cos(a)*62,H/2+Math.sin(a)*62,8,0,7);ctx.fill()}
for(let s of slashes){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.ang);ctx.globalAlpha=s.life/s.max;ctx.fillStyle=weapon.color;ctx.beginPath();ctx.ellipse(0,0,s.len*.72,s.width,.0,-.8,.8);ctx.fill();ctx.restore()}for(let p of projectiles){ctx.fillStyle=p.color;ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.shadowBlur=0}for(let e of enemies){ctx.fillStyle=e.hit?'#f1cfaa':e.type==='brute'?'#7e4143':'#4f3c58';ctx.beginPath();ctx.ellipse(e.x,e.y,e.r+(e.type==='brute'?5:0),e.r,0,0,7);ctx.fill();ctx.fillStyle='#0d0b10';ctx.beginPath();ctx.arc(e.x-5,e.y-3,2.5,0,7);ctx.arc(e.x+5,e.y-3,2.5,0,7);ctx.fill();ctx.fillStyle='#3b2c2b';ctx.fillRect(e.x-18,e.y-25,36,3);ctx.fillStyle='#c96258';ctx.fillRect(e.x-18,e.y-25,36*(e.hp/e.max),3)}ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.aim);ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*12)%2?.35:1;ctx.fillStyle='#c1ad8c';ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();ctx.fillStyle='#28232d';ctx.beginPath();ctx.moveTo(-12,-12);ctx.lineTo(0,-23);ctx.lineTo(12,-12);ctx.closePath();ctx.fill();ctx.strokeStyle=weapon.color;ctx.lineWidth=weapon.kind==='bow'?3:4;ctx.beginPath();if(weapon.kind==='bow'){ctx.arc(10,0,12,-Math.PI/2,Math.PI/2);ctx.moveTo(10,-12);ctx.lineTo(28,0);ctx.lineTo(10,12)}else{ctx.moveTo(8,0);ctx.lineTo(weapon.kind==='spear'?35:24,0)}ctx.stroke();ctx.restore();for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/.35);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
